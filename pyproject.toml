[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "olobrain"
version = "1.0.0"
description = "OloBrain: 3D Spatial Neurosurgical & Neurophysiological Workstation (139 Brain Structures)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Gabriel (Silent343)" },
]
license = "MIT"
dependencies = [
    "numpy>=1.26.0",
    "PySide6>=6.6.0",
    "PyOpenGL>=3.1.7",
    "opencv-python>=4.9.0",
    "mediapipe>=0.10.9",
    "Pillow>=10.2.0",
]

[project.scripts]
olobrain = "olobrain.main:main"

[tool.setuptools.packages.find]
where = ["src"]
